events {}

http {
  # upstream — группа backend-серверов для балансировки
  # По умолчанию используется алгоритм Round Robin: запросы идут по кругу 1→2→1→2...
  upstream backend {
    server backend1:3000 max_fails=2 fail_timeout=30s; # Сервер 1 (основной)
    server backend2:3000 max_fails=2 fail_timeout=30s; # Сервер 2 (основной)
    server backend3:3000 backup;                        # Резервный сервер — включается если оба основных упали
  }

  server {
    listen 80;

    location / {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      # Сколько ждать подключения и ответа — после этого считается фейл
      proxy_connect_timeout 2s;
      proxy_read_timeout 2s;
    }
  }
}
