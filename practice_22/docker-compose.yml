services:
  # Три экземпляра одного и того же сервера — отличаются только переменной PORT
  backend1:
    build: .
    environment:
      PORT: 3000

  backend2:
    build: .
    environment:
      PORT: 3000

  backend3:
    build: .
    environment:
      PORT: 3000

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3

  haproxy:
    image: haproxy:2.9
    ports:
      - "8080:8080"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - backend1
      - backend2
      - backend3
