global
    log stdout format raw local0

defaults
    log     global
    mode    http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# frontend — принимает входящие запросы
frontend http_front
    bind *:8080
    default_backend http_back

# backend — список серверов и алгоритм балансировки
backend http_back
    balance roundrobin                          # алгоритм: по кругу
    option httpchk GET /health                  # health check: GET /health на каждом сервере
    server backend1 backend1:3000 check         # check — включает автоматическую проверку доступности
    server backend2 backend2:3000 check
    server backend3 backend3:3000 backup check  # backup — включается только если оба основных недоступны
